<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>v/h lamp film renderer</title>
<!-- Renders the launch film frame by frame. Serve the repo root, open /scripts/film/film.html,
     then call window.renderFrame(t) for t in seconds. Storyline: context/vh-lamp-launch-storyline.md -->
<style>
@font-face{font-family:'Neue Montreal';src:url(../../assets/neuemontreal-medium.otf);font-weight:500}
@font-face{font-family:'Neue Montreal';src:url(../../assets/neuemontreal-regular.otf);font-weight:400}
@font-face{font-family:'Neue Montreal';src:url(../../assets/neuemontreal-bold.otf);font-weight:700}
:root{--paper:#f4f3ed;--ink:#252720;--red:#be3c28;--muted:#a9ab9f}
html,body{margin:0;background:var(--ink)}
#film{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'Neue Montreal',sans-serif}
#art{position:absolute;left:50%;top:60px;transform:translateX(-50%)}
#art.sq{width:400px;height:400px}
#art.wide{width:800px;height:400px}
#art svg{width:100%;height:100%;display:block;overflow:visible}
#era{position:absolute;left:0;right:0;top:496px;text-align:center;font-size:18px;color:var(--muted)}
#line{position:absolute;left:80px;right:80px;top:528px;text-align:center;font-size:56px;font-weight:500;letter-spacing:-.045em;line-height:1.05}
#line.big{white-space:pre-line;top:250px;font-size:92px;letter-spacing:-.06em}
#flash{position:absolute;inset:0;background:#fff4d6;opacity:0}
#mark{position:absolute;left:44px;top:32px;font-weight:700;font-size:34px;letter-spacing:-.065em}
#mark i,#end i{font-style:normal;color:var(--red)}
#note{position:absolute;right:44px;bottom:30px;font-size:13px;color:#8d8f84}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:var(--red);color:var(--paper)}
#end .big{font-size:190px;font-weight:700;letter-spacing:-.09em;line-height:.9}
#end i{color:var(--paper)}
#end .t{font-size:50px;font-weight:500;letter-spacing:-.045em;margin-top:30px}
#end .cta{margin-top:34px;font-size:22px;padding:16px 32px;border:1.5px solid var(--paper);border-radius:40px}
</style></head>
<body>
<div id="film"><div id="art" class="sq"></div><div id="era"></div><div id="line"></div><div id="flash"></div><div id="mark">v<i>/</i>h</div><div id="note">Concept film. Product in development.</div>
<div id="end"><div class="big">v/h</div><div class="t">The new way to live with light.</div><div class="cta">Pre-order at vh.do ↗</div></div></div>
<script type="module">
import { cave, diya, lantern, bulb, deskLamp, phone, voice, room } from '../../preorder-art.mjs';
const $ = id => document.getElementById(id);
const clamp = v => Math.max(0, Math.min(1, v));
const ease = v => v * v * (3 - 2 * v);
const fade = (t, a, b, d = 0.55) => ease(clamp((t - a) / d)) * ease(clamp((b - t) / d));
const flick = t => Math.sin(t * 17) * 0.5 + Math.sin(t * 7.3) * 0.5;
const pair = (a, b) => `<div style="display:flex;width:100%;height:100%"><div style="flex:1">${a}</div><div style="flex:1">${b}</div></div>`;

const scenes = [
  { a: 0, b: 4, era: 'The first light', line: 'It started with fire.', art: t => cave(0.8 + flick(t) * 0.12, flick(t)) },
  { a: 4, b: 8, era: 'Thousands of years ago', line: 'Then we held it in our hands.', art: t => diya(0.75 + flick(t) * 0.12, flick(t)) },
  { a: 8, b: 11, era: 'Centuries of lanterns', line: 'Then we put it behind glass.', art: t => lantern(0.7 + flick(t) * 0.1, flick(t)) },
  { a: 11, b: 15, era: '1879', line: 'Then came the switch.', art: t => bulb(1, clamp((t - 12) / 0.25)) },
  { a: 15, b: 19, era: 'The 20th century', line: 'A century of better lamps.', art: t => deskLamp(ease(clamp((t - 15.6) / 0.8)) * 0.9) },
  { a: 19, b: 23, era: 'The 2010s', line: 'Then we put it in an app.', art: t => { const k = 0.5 + Math.sin((t - 19) * 1.7) * 0.45; return pair(phone(k), bulb(k * 0.9, 1)); } },
  { a: 23, b: 27, era: '2025', line: 'Then we started talking to it.', art: t => pair(voice(((t - 23) * 0.8) % 1.5), bulb(0.8, 1)) },
  { a: 27, b: 32, wide: true, line: "But it still doesn't know you're there.", art: t => room({ enter: ease(clamp((t - 27.2) / 1.6)), sit: ease(clamp((t - 28.9) / 0.6)), light: 0, phoneGlow: clamp((t - 29.6) / 0.6), vh: false }) },
  { a: 32, b: 38, wide: true, line: t => (t < 35.2 ? "Sit down. It's on." : "Get up. It's off."), art: t => {
      const enter = ease(clamp((t - 32.1) / 1.4));
      const sit = t < 35.2 ? ease(clamp((t - 33.5) / 0.5)) : 1 - ease(clamp((t - 35.25) / 0.4));
      const leave = t < 35.7 ? 0 : ease(clamp((t - 35.7) / 1.8));
      const light = t < 35.2 ? ease(clamp((t - 33.8) / 0.7)) : 1 - ease(clamp((t - 36.5) / 0.9));
      return room({ enter, sit, leave, light, vh: true });
    } },
  { a: 38, b: 41.3, big: true, line: 'No app. No voice. No phone.', art: () => '' },
  { a: 41.3, b: 44.6, big: true, line: 'Plug it in once.\nIt does the rest.', art: () => '' },
];

window.renderFrame = t => {
  const s = scenes.find(x => t >= x.a && t < x.b);
  $('end').style.opacity = clamp((t - 44.3) / 0.6);
  if (s) {
    const o = fade(t, s.a, s.b);
    const art = $('art');
    art.className = s.wide ? 'wide' : 'sq';
    art.innerHTML = `<div style="opacity:${o};width:100%;height:100%">${s.art(t)}</div>`;
    $('era').textContent = s.era || ''; $('era').style.opacity = o;
    const line = typeof s.line === 'function' ? s.line(t) : s.line;
    $('line').textContent = line; $('line').className = s.big ? 'big' : '';
    // In the reveal scene the line swaps mid-scene, so fade it around the swap too.
    const swap = s.a === 32 ? Math.min(1, Math.abs(t - 35.2) / 0.3) : 1;
    $('line').style.opacity = o * swap;
  } else { $('art').innerHTML = ''; $('line').textContent = ''; $('era').textContent = ''; }
  const f = t > 12 && t < 12.7 ? 1 - (t - 12) / 0.7 : 0;
  $('flash').style.opacity = (f * 0.85).toFixed(3);
};
window.DURATION = 48;
await document.fonts.ready;
window.renderFrame(0);
window.ready = true;
</script></body></html>
